name: wheels

# Build manylinux wheels for cp27 + cp39 on x86_64 + aarch64, plus an sdist.
# Nothing is published unless the run is dispatched with `publish` set to
# testpypi or pypi -- a plain run only builds and uploads artifacts.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish target (none = build only)'
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  build_py3:
    name: py3 wheels (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (cross-arch)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build cp39 wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp39-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: python -c "import umysql; print(umysql.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cp39-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_py2:
    name: py2.7 wheel (${{ matrix.label }})
    # ubuntu-22.04 is the last LTS that packages python2.7 in apt; GitHub's native
    # ARM64 runner builds the aarch64 wheel without QEMU or a manylinux image.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, label: x86_64 }
          - { runner: ubuntu-22.04-arm, label: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 2.7 + build tools (per ffcpy copilot-setup recipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 python2.7-dev build-essential patchelf
          curl -sS https://bootstrap.pypa.io/pip/2.7/get-pip.py -o /tmp/get-pip.py
          sudo python2.7 /tmp/get-pip.py
          python2.7 -m pip install "setuptools<45" "wheel<0.34"
      - name: Build cp27 wheel, then auditwheel-repair to a manylinux tag for PyPI
        run: |
          mkdir -p raw wheelhouse
          python2.7 -m pip wheel . --no-deps -w raw
          echo "=== raw (linux_x86_64) wheel ==="; ls -l raw
          # auditwheel runs on py3, bundles libstdc++, and retags to manylinux_2_XX
          # (the runner's glibc) so PyPI accepts it -- a bare linux_x86_64 tag is rejected.
          python3 -m pip install --user auditwheel
          for whl in raw/*.whl; do python3 -m auditwheel repair "$whl" -w wheelhouse; done
          echo "=== manylinux wheel ==="; ls -l wheelhouse
      - name: Smoke-test import under python2.7
        run: |
          python2.7 -m pip install wheelhouse/*.whl
          python2.7 -c "import umysql; print(umysql.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cp27-${{ matrix.label }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to ${{ inputs.publish }}
    needs: [build_py3, build_py2, sdist]
    if: inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish == 'pypi' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Publish to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
