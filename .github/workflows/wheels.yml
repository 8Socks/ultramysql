name: wheels

# Build manylinux wheels for cp27 + cp39 on x86_64 + aarch64, plus an sdist.
# Nothing is published unless the run is dispatched with `publish` set to
# testpypi or pypi -- a plain run only builds and uploads artifacts.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish target (none = build only)'
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  build_py3:
    name: py3 wheels (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (cross-arch)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build cp39 wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp39-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: python -c "import umysql; print(umysql.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cp39-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_py2:
    name: py2.7 wheel (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cp27 x86_64 wheel (a frozen manylinux that still ships py2.7)
        run: |
          mkdir -p wheelhouse
          built=0
          # manylinux2014/2010 *latest* dropped py2.7; the older frozen images still
          # carry cp27. Try each and use the first that has it (x86_64 only -- no
          # manylinux image ships py2.7 for aarch64).
          for IMG in \
            quay.io/pypa/manylinux2010_x86_64:latest \
            quay.io/pypa/manylinux1_x86_64:latest ; do
            echo "### trying $IMG"
            docker pull -q "$IMG" || { echo "pull failed"; continue; }
            HASCP27=$(docker run --rm "$IMG" bash -c 'ls -d /opt/python/cp27-* 2>/dev/null | head -1 || true')
            echo "cp27 in image: ${HASCP27:-<none>}"
            [ -n "$HASCP27" ] || continue
            docker run --rm -v "$PWD":/io -w /io "$IMG" bash -c '
              set -e
              mkdir -p /tmp/w
              for PYBIN in /opt/python/cp27-*/bin; do
                echo "=== building with $PYBIN ==="
                "$PYBIN/pip" wheel /io --no-deps -w /tmp/w
              done
              for whl in /tmp/w/*.whl; do auditwheel repair "$whl" -w /io/wheelhouse; done
              CP=$(ls /opt/python/cp27-*/bin/python | head -1)
              "$CP" -m pip install /io/wheelhouse/*.whl
              "$CP" -c "import umysql; print(umysql.__version__)"
            '
            built=1; break
          done
          [ "$built" = 1 ] || { echo "FAILED: no manylinux image with cp27 available"; exit 1; }
          echo "=== cp27 wheels ==="; ls -l wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cp27-x86_64
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to ${{ inputs.publish }}
    needs: [build_py3, build_py2, sdist]
    if: inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish == 'pypi' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Publish to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
